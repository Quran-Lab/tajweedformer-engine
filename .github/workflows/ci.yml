name: CI

# Every push: build the engine on Linux, macOS and Windows and run its tests (ctest: the engine's own in
# engine/tests and the tajweed library's in tajweed/tests; none needs a model file or the network).
# The V4 conformance (35 clips, every output of every chunk, bit for bit) also needs the model folder,
# which Quran Lab serves with an app key (cdn.quranlab.ai/models): it runs when the repository has a
# QURANLAB_CI_KEY secret (an app key of an account whose access request was approved) and is skipped
# (with a notice) otherwise, for example on forks. The variable QURANLAB_MODEL_REVISION pins the model
# revision; without it scripts/fetch-model.py takes the current release.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Tools (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y --no-progress
      - name: Tools (Linux; the runner image has ninja, the install is only for an image that lacks it)
        if: runner.os == 'Linux'
        run: |
          command -v ninja && exit 0
          for try in 1 2 3; do
            timeout 120 sudo apt-get install -y -o Acquire::Retries=2 ninja-build && exit 0
            echo "::warning::apt attempt $try failed (the package mirror did not answer)"
            sleep 20
          done
          echo "::error::ninja is not on this runner and no package mirror answered in three tries"
          exit 1
      - name: Tools (macOS)
        if: runner.os == 'macOS'
        run: brew list ninja >/dev/null 2>&1 || brew install ninja
      - name: Build
        run: |
          if [ "$RUNNER_OS" = Windows ]; then P=windows-mingw-dev; else P=host-dev; fi
          echo "PRESET=$P" >> "$GITHUB_ENV"
          cmake --preset $P
          cmake --build --preset $P
      - name: Release build (what an app links)
        if: runner.os != 'Windows'
        run: cmake --preset host-release && cmake --build --preset host-release
      - name: Tests
        run: ctest --test-dir build/$PRESET --output-on-failure --no-tests=error
      - name: Conformance data
        id: data
        env:
          QURANLAB_KEY: ${{ secrets.QURANLAB_CI_KEY }}
          QURANLAB_MODEL_REVISION: ${{ vars.QURANLAB_MODEL_REVISION }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$QURANLAB_KEY" ]; then echo "::notice::no QURANLAB_CI_KEY secret: V4 conformance skipped"; echo "run=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          scripts/fetch-conformance-data.sh data
          python3 scripts/fetch-model.py model
          echo "run=1" >> "$GITHUB_OUTPUT"
      - name: V4 conformance
        if: steps.data.outputs.run == '1'
        run: bench/v4_conformance.sh build/$PRESET model/sdk/v4.0 data
